<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSS агрегатор</title>
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="display-4">RSS агрегатор</h1>
      <p class="lead">Начните читать RSS сегодня! Это легко, это красиво.</p>

      <div id="message-container"></div>

      <form id="rss-form" class="mt-4">
        <div class="mb-3">
          <label for="rss-url" class="form-label">Ссылка RSS</label>
          <input
            type="url"
            class="form-control"
            id="rss-url"
            placeholder="Введите ссылку"
            required
          />
          <div class="invalid-feedback"></div>
        </div>
        <button type="submit" class="btn btn-primary">Добавить</button>
      </form>

      <div class="mt-3 text-muted">
        <small>Пример: <a href="https://lorem-rs.shexlet.app/feed" target="_blank">https://lorem-rs.shexlet.app/feed</a></small>
      </div>

      <div id="feeds-container" class="mt-4"></div>
      <div id="posts-container" class="mt-4"></div>
    </div>

    <!-- Нативное модальное окно (dialog) -->
    <dialog id="postModal" data-test="modal-body">
      <div class="modal-content">
        <h5 id="postModalTitle">Заголовок</h5>
        <p id="postModalBody">Описание поста</p>
        <footer>
          <button id="modalCloseBtn" class="btn btn-secondary">Закрыть</button>
          <a href="#" id="postModalLink" class="btn btn-primary" target="_blank">Читать полностью</a>
        </footer>
      </div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
